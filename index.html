<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #1e40af;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .hero {
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg,
                    #60a5fa,
                    #2563eb);
            color: white;
        }

        .hero h1 {
            font-size: 40px;
        }

        .contenido {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px #ccc;
            text-align: center;
        }

        .card button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .card button:hover {
            background: #1e40af;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi Primera Página Web</h1>
        <p>Proyecto colaborativo con GitHub</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="#">Servicios</a>
        <a href="login.html">Contacto / Formulario</a>
    </nav>

    <section class="hero">
        <div>
            <h1>Bienvenidos 🚀</h1>
            <p>Aprendiendo desarrollo web</p>
        </div>
    </section>

    <section class="contenido">

        <div class="card">
            <h2>HTML</h2>
            <p>Estructura de la página web.</p>
            <button onclick="mensaje('HTML')">
                Ver más
            </button>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Diseño y estilos visuales.</p>
            <button onclick="mensaje('CSS')">
                Ver más
            </button>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Interactividad del sitio.</p>
            <button onclick="mensaje('JavaScript')">
                Ver más
            </button>
        </div>

    </section>

    <footer>
        <p>© 2026 Mi Página Web</p>
    </footer>

    <script>
        function mensaje(tecnologia) {
            alert("Seleccionaste: " + tecnologia);
        }
    </script>

</body>

</html>
