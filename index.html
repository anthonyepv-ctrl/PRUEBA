<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="container">
        <section class="form-card">
            <header class="card-header">
                <span class="badge">
                    <span class="badge-dot"></span>
                    Portal de Acceso
                </span>
                <h1 class="card-title">Hola Mundo</h1>
                <p class="card-subtitle">Bienvenido a mi página web. Ingresa tus datos para continuar.</p>
            </header>

            <form action="/submit" method="post" id="contactForm">
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            class="form-input" 
                            placeholder="Ej. Juan Pérez" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="nombre@ejemplo.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span>Enviar datos</span>
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 12 14 0"></path>
                        <path d="m13 18 6-6"></path>
                        <path d="m13 6 6 6"></path>
                    </svg>
                </button>
            </form>

            <footer class="info-box">
                <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Atque sit dolorum ullam voluptate facilis accusamus cupiditate sapiente.</p>
            </footer>
        </section>
    </main>
</body>
</html>
